<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lunar surface viewer</title>
  <link rel="stylesheet" href="atlas.css">
</head>
<body>
  <div class="projections" role="group" aria-label="Map projection">
    <button id="globe" aria-pressed="true">3D globe</button>
    <button id="flat" aria-pressed="false">2D map</button>
  </div>
  <main class="viewport" aria-label="Interactive lunar surface">
    <canvas id="surface" aria-hidden="true"></canvas>
    <canvas id="overlay" tabindex="0" aria-label="Lunar surface. Use arrow keys to pan and plus or minus to zoom."></canvas>
    <div class="intro">
      <h1>Explore the lunar surface.</h1>
      <p>Drag to explore · Pinch or use + and − to zoom</p>
    </div>
    <div class="controls" role="group" aria-label="Camera controls">
      <button id="closer" aria-label="Zoom in">+</button>
      <button id="farther" aria-label="Zoom out">−</button>
      <button id="reset" aria-label="Reset view">⌂</button>
    </div>
    <div id="feature" class="feature" hidden>
      <button id="dismiss" aria-label="Dismiss feature">×</button>
      <p id="feature-type"></p>
      <h2 id="feature-name"></h2>
      <p id="feature-info"></p>
    </div>
    <p id="notice" role="status"></p>
    <footer>
      <span id="coords">Move over the surface for coordinates</span>
      <span id="scale"></span>
      <span><a href="https://svs.gsfc.nasa.gov/4720/" target="_blank" rel="noreferrer">NASA LRO</a> · <a href="https://planetarynames.wr.usgs.gov/GIS_Downloads" target="_blank" rel="noreferrer">IAU/USGS</a> · <a href="https://azmth.space/moon/data" target="_blank" rel="noreferrer">Landing data</a> (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a>)</span>
    </footer>
  </main>
  <script type="module" src="atlas.js"></script>
</body>
</html>
